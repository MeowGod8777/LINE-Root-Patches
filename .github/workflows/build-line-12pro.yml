name: Build LINE 12 Pro Non-Root

on:
  workflow_dispatch:
  push:
    paths:
      - 'nonroot-12pro/**'
      - '.github/workflows/build-line-12pro.yml'

permissions:
  contents: read
  packages: read

env:
  LINE_MICROG_VENDOR: app.line12pro
  LINE_MICROG_PACKAGE: app.line12pro.android.gms

jobs:
  line:
    name: Patch LINE 26.11.0 + dedicated GmsCore auth
    runs-on: ubuntu-latest
    steps:
      - name: Checkout config
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Fetch Andrew patches source
        run: git clone --depth 1 https://github.com/andrewliang25/morphe-patches.git morphe-patches

      - name: Retarget LINE GmsCore auth to dedicated MicroG-RE
        shell: bash
        run: |
          set -euo pipefail
          PATCH='morphe-patches/patches/src/main/kotlin/app/andrewliang/patches/line/gmscoreauth/GmsCoreAuthPatch.kt'
          test -f "$PATCH"
          grep -q 'app.revanced' "$PATCH"
          sed -i 's/app\.revanced/app.line12pro/g' "$PATCH"

          echo '=== dedicated GmsCore constants ==='
          grep -nE 'MICROG_PACKAGE|MICROG_ACCOUNT_TYPE|MICROG_CHOOSE_ACCOUNT_ACTION|MICROG_AUTH_SERVICE_ACTION|META_SPOOFED_SIGNATURE' "$PATCH"
          grep -q 'app.line12pro.android.gms' "$PATCH"
          if grep -q 'app.revanced' "$PATCH"; then
            echo 'ERROR: old ReVanced vendor remains in LINE GmsCore auth patch'
            exit 1
          fi

      - name: Build custom Andrew patch bundle
        working-directory: morphe-patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean :patches:buildAndroid
          CUSTOM_MPP=$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' \
            ! -name '*sources*' ! -name '*javadoc*' | head -1)
          test -n "$CUSTOM_MPP"
          cp "$CUSTOM_MPP" "$GITHUB_WORKSPACE/line12pro-patches.mpp"
          ls -lh "$GITHUB_WORKSPACE/line12pro-patches.mpp"

      - name: Fetch Andrew builder
        run: git clone --depth 1 https://github.com/andrewliang25/patched-apps.git builder

      - name: Allow local custom patch bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('builder/utils.sh')
          s = p.read_text()
          needle = '''\t\tif [ "$tag" = "Patches" ]; then
\t\t\tif [ "$grab_cl" = true ]; then'''
          replacement = '''\t\tif [ "$tag" = "Patches" ]; then
\t\t\tif [ -n "${LOCAL_PATCHES_BUNDLE-}" ]; then
\t\t\t\tpr "Overriding downloaded patch bundle with $LOCAL_PATCHES_BUNDLE" >&2
\t\t\t\tcp "$LOCAL_PATCHES_BUNDLE" "$file"
\t\t\tfi
\t\t\tif [ "$grab_cl" = true ]; then'''
          if needle not in s:
              raise SystemExit('builder utils.sh injection point not found')
          p.write_text(s.replace(needle, replacement, 1))
          PY

      - name: Apply 12 Pro config
        run: cp nonroot-12pro/config.toml builder/config-12pro.toml

      - name: Build patched LINE
        working-directory: builder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_VER_CODE: ${{ github.run_number }}
          LOCAL_PATCHES_BUNDLE: ${{ github.workspace }}/line12pro-patches.mpp
        run: ./build.sh config-12pro.toml

      - name: Show outputs
        if: always()
        run: |
          find builder/build -maxdepth 1 -type f -printf '%f\n' 2>/dev/null || true
          test -d builder/build && ls -lh builder/build || true

      - name: Upload patched LINE APK
        uses: actions/upload-artifact@v7
        with:
          name: LINE-26.11.0-12Pro-dedicated-MicroG
          archive: false
          path: builder/build/*.apk
          if-no-files-found: error

  microg:
    name: Build dedicated LINE MicroG-RE
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 18
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '18'

      - name: Checkout MicroG-RE
        uses: actions/checkout@v6
        with:
          repository: MorpheApp/MicroG-RE
          path: microg-re
          submodules: recursive

      - name: Change MicroG-RE vendor namespace
        working-directory: microg-re
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ext.basePackageName = "app.revanced"' build.gradle
          sed -i 's/ext\.basePackageName = "app\.revanced"/ext.basePackageName = "app.line12pro"/' build.gradle
          grep -n 'basePackageName' build.gradle | head
          grep -q 'ext.basePackageName = "app.line12pro"' build.gradle

      - name: Build dedicated MicroG-RE
        working-directory: microg-re
        run: ./gradlew --no-daemon clean :play-services-core:assembleDefaultRelease

      - name: Sign and verify dedicated MicroG-RE
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED=$(find microg-re/play-services-core/build/outputs/apk/default/release -type f -name '*.apk' | head -1)
          test -n "$UNSIGNED"

          keytool -genkeypair -noprompt \
            -keystore microg-re-line12pro.jks -storepass android -keypass android \
            -alias microgreline -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=MicroG-RE LINE 12 Pro,O=LINE 12 Pro,C=TW'

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" sign \
            --ks microg-re-line12pro.jks --ks-pass pass:android --key-pass pass:android \
            --out MicroG-RE-LINE-12Pro.apk "$UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs MicroG-RE-LINE-12Pro.apk

          echo '=== APK package ==='
          "$AAPT" dump badging MicroG-RE-LINE-12Pro.apk | head -1 | tee package.txt
          grep -q "package: name='app.line12pro.android.gms'" package.txt

      - name: Upload dedicated MicroG-RE APK
        uses: actions/upload-artifact@v7
        with:
          name: MicroG-RE-LINE-12Pro-dedicated
          archive: false
          path: MicroG-RE-LINE-12Pro.apk
          if-no-files-found: error
