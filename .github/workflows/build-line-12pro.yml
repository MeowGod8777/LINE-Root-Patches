name: Build LINE 12 Pro Non-Root

on:
  workflow_dispatch:
  push:
    paths:
      - 'nonroot-12pro/**'
      - '.github/workflows/build-line-12pro.yml'

permissions:
  contents: read

jobs:
  line:
    name: Patch LINE 26.11.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout config
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Fetch Andrew builder
        run: git clone --depth 1 https://github.com/andrewliang25/patched-apps.git builder

      - name: Apply 12 Pro config
        run: cp nonroot-12pro/config.toml builder/config-12pro.toml

      - name: Build patched LINE
        working-directory: builder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_VER_CODE: ${{ github.run_number }}
        run: ./build.sh config-12pro.toml

      - name: Show outputs
        if: always()
        run: |
          find builder/build -maxdepth 1 -type f -printf '%f\n' 2>/dev/null || true
          test -d builder/build && ls -lh builder/build || true

      - name: Upload patched LINE APK
        uses: actions/upload-artifact@v7
        with:
          name: LINE-26.11.0-12Pro-Andrew
          archive: false
          path: builder/build/*.apk
          if-no-files-found: error

  microg:
    name: Build MicroG-RE dependency
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Setup Java 18
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '18'

      - name: Checkout MicroG-RE
        uses: actions/checkout@v6
        with:
          repository: MorpheApp/MicroG-RE
          path: microg-re
          submodules: recursive

      - name: Build MicroG-RE
        working-directory: microg-re
        run: ./gradlew --no-daemon clean :play-services-core:assembleDefaultRelease

      - name: Sign MicroG-RE
        run: |
          UNSIGNED=$(find microg-re/play-services-core/build/outputs/apk/default/release -type f -name '*.apk' | head -1)
          test -n "$UNSIGNED"
          keytool -genkeypair -noprompt \
            -keystore microg-re.jks -storepass android -keypass android \
            -alias microgre -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=MicroG-RE Local Build,O=LINE 12 Pro,C=TW'
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks microg-re.jks --ks-pass pass:android --key-pass pass:android \
            --out MicroG-RE-12Pro-signed.apk "$UNSIGNED"
          "$APKSIGNER" verify --verbose MicroG-RE-12Pro-signed.apk

      - name: Upload MicroG-RE APK
        uses: actions/upload-artifact@v7
        with:
          name: MicroG-RE-for-LINE-backup
          archive: false
          path: MicroG-RE-12Pro-signed.apk
          if-no-files-found: error
