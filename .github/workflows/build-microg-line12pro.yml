name: Build LINE Dedicated MicroG-RE

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-microg-line12pro.yml'

permissions:
  contents: read

jobs:
  microg:
    name: Build app.line12pro.android.gms
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 18
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '18'

      - name: Checkout MicroG-RE
        uses: actions/checkout@v6
        with:
          repository: MorpheApp/MicroG-RE
          path: microg-re
          submodules: recursive

      - name: Retarget vendor namespace
        working-directory: microg-re
        run: |
          set -euo pipefail
          grep -q 'ext.basePackageName = "app.revanced"' build.gradle
          sed -i 's/ext\.basePackageName = "app\.revanced"/ext.basePackageName = "app.line12pro"/' build.gradle
          grep -n 'basePackageName' build.gradle | head
          grep -q 'ext.basePackageName = "app.line12pro"' build.gradle

      - name: Build MicroG-RE
        working-directory: microg-re
        run: ./gradlew --no-daemon clean :play-services-core:assembleDefaultRelease

      - name: Sign and verify package
        run: |
          set -euo pipefail
          UNSIGNED=$(find microg-re/play-services-core/build/outputs/apk/default/release -type f -name '*.apk' | head -1)
          test -n "$UNSIGNED"
          keytool -genkeypair -noprompt \
            -keystore line-microg.jks -storepass android -keypass android \
            -alias line-microg -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=LINE 12 Pro MicroG-RE,O=LINE 12 Pro,C=TW'
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks line-microg.jks --ks-pass pass:android --key-pass pass:android \
            --out MicroG-RE-LINE-12Pro.apk "$UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs MicroG-RE-LINE-12Pro.apk
          "$AAPT" dump badging MicroG-RE-LINE-12Pro.apk | head -1 | tee package.txt
          grep -q "package: name='app.line12pro.android.gms'" package.txt

      - name: Upload dedicated MicroG-RE
        uses: actions/upload-artifact@v7
        with:
          name: MicroG-RE-LINE-12Pro-dedicated
          archive: false
          path: MicroG-RE-LINE-12Pro.apk
          if-no-files-found: error
